[package]
name = "badger-ratatui"
version = "0.1.0"
edition = "2024"

[dependencies]
libm = "0.2"
embedded-graphics = "0.8"
embedded-graphics-unicodefonts = "0.2"
ratatui = { version = "0.30", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-futures = "0.1"
embassy-rp = { version = "0.10", features = ["rp235xb", "time-driver", "critical-section-impl", "unstable-pac", "binary-info"] }
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-usb = "0.6"
embedded-alloc = "0.7"
static_cell = "2"
